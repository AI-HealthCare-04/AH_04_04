upstream fastapi {
    server fastapi:8000;
}

server {
    server_name 도메인 혹은 EC2_IP;

    listen 80;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 운동 영상 정적 서빙(#72/#199). https 템플릿과 동일 — 호스트 미디어 디렉터리를 컨테이너에
    #   읽기전용 마운트(compose 볼륨)해 nginx 가 직접 서빙(Range 지원). http-only 배포에서도 동작.
    location /videos/ {
        alias /srv/media/videos/;
        try_files $uri =404;

        types {
            video/mp4 mp4;
            image/webp webp;
            image/jpeg jpg jpeg;
            image/png png;
        }

        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 404;
    }
}
