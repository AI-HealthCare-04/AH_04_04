# =====================================================================================
# 운영 nginx 설정 — **이 파일이 단일 원천(source of truth)이다.**
#
# 이력: 원래 레포에는 80 포트 템플릿만 있었고 실물(443/videos 포함)은 서버에서 수동 관리돼
#   레포와 발산해 있었다(#244 점검에서 확인). 이 커밋에서 실물을 레포로 승격하고, 이후 변경은
#   반드시 레포 수정 → 리뷰 → 서버 반영(아래 절차) 순서로 한다. 서버에서 직접 고치지 말 것.
#
# 서버 반영 절차(무중단, docs/mvp-db-recovery.md 와 같은 ~/project 기준):
#   scp -i ~/.ssh/AH_04_04.pem infra/nginx/default.conf ubuntu@<EC2_IP>:~/project/infra/nginx/default.conf
#   ssh -i ~/.ssh/AH_04_04.pem ubuntu@<EC2_IP> \
#     "docker exec docker-nginx-1 nginx -t && docker exec docker-nginx-1 nginx -s reload"
#   (nginx -t 실패 시 reload 하지 말고 레포에서 수정 후 다시 — 컨테이너는 기존 설정으로 계속 동작한다)
#
# 반영 후 검증(#268 리뷰 — 전부 통과해야 반영 완료다. EC2 안에서 실행, --resolve 라 외부 DNS 무관):
#   B=https://aigo-health.duckdns.org; R="--resolve aigo-health.duckdns.org:443:127.0.0.1"
#   curl -fsS  $R $B/health                                  # ① 200 — nginx→fastapi 프록시 생존
#   curl -fsSI $R $B/videos/<기존 파일.mp4> | head -1          # ② 200 — 영상 서빙 회귀 없음
#   for t in service-1.0 privacy-1.0 sensitive-health-1.0 marketing-1.0; do
#     curl -fsSI $R $B/terms/$t | grep -i '^content-type.*utf-8'   # ③ 각 버전 200 + UTF-8
#   done
#   curl -sI http://127.0.0.1/api/ -H 'Host: aigo-health.duckdns.org' \
#     | grep -i '^location: https://aigo-health.duckdns.org'       # ④ HTTP → canonical HTTPS 301
#   결과(각 명령 출력)를 반영 PR/이슈 코멘트에 기록해 둔다.
#
# ⚠️ 자동 배포(deploy.yml)는 이 파일을 업로드하지 않는다 — conf 반영은 문법 검증(nginx -t)을
#   거쳐야 해서 위 수동 절차로 분리한다(잘못된 conf 자동 반영으로 전 서비스가 죽는 것 방지).
# =====================================================================================

upstream fastapi {
    server fastapi:8000;
}

# 예상 밖 Host 차단(#268 리뷰): IP 직접 접근·임의 Host 헤더는 아래 명명 서버에 못 들어오게
#   default_server 에서 끊는다. 80 은 444(응답 없이 연결 종료), 443 은 TLS 핸드셰이크 자체를
#   거부(ssl_reject_handshake, nginx 1.19.4+ — 운영 이미지 nginx:latest 라 지원)해 엉뚱한 SNI 의
#   스캐너에게 인증서도 내주지 않는다.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# http — ACME 갱신 경로만 열어두고 나머지는 전부 https로 보낸다.
server {
    listen 80;
    server_name aigo-health.duckdns.org;

    # certbot webroot 갱신 경로 (https로 리다이렉트하면 갱신이 실패한다)
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    # #244 §2: /api/ 만 301이고 나머지가 404였던 것을 catch-all 301로 정리.
    #   (ACME 경로만 위에서 예외 — location 매칭 우선순위상 안전)
    #   canonical host 고정(#268 리뷰): $host 는 요청 Host 헤더를 따라가 이 서버가 기본 vhost 로
    #   매칭되면 임의 도메인 301 을 만들 수 있다(open-redirect 표면). 서비스 도메인이 하나뿐이니
    #   고정 도메인으로 보낸다(위 default_server 차단과 이중 방어).
    location / {
        return 301 https://aigo-health.duckdns.org$request_uri;
    }
}

# https
server {
    listen 443 ssl;
    http2 on;
    server_name aigo-health.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/aigo-health.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigo-health.duckdns.org/privkey.pem;

    # certbot 의 options-ssl-nginx.conf 와 ssl-dhparams.pem 은 **certbot nginx 플러그인**을
    #   설치했을 때만 생성된다. 우리는 `certonly --webroot` 로 발급하므로 두 파일이 없다.
    #   include 로 참조하면 nginx 가 기동에 실패한다("open() ... failed") — 그래서 같은 수준의
    #   설정을 여기에 직접 둔다. ECDHE 계열만 쓰므로 ssl_dhparam(DHE 용)도 필요 없다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 앱은 /api/ 만 쓰지만, 배포 확인용으로 /health 는 밖에서도 볼 수 있어야 한다(#101).
    #   이게 없으면 서버 생존 확인을 /api/docs 로 대신해야 한다.
    location = /health {
        proxy_pass http://fastapi/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 운동 영상 정적 서빙(#199/#72). 호스트 /opt/ah0404/media/videos 를 nginx 컨테이너에
    #   /srv/media/videos 로 읽기전용 마운트(compose 볼륨). Range 요청은 nginx 정적 서빙이 기본 지원.
    location /videos/ {
        alias /srv/media/videos/;
        try_files $uri =404;

        types {
            video/mp4 mp4;
            image/webp webp;
            image/jpeg jpg jpeg;
            image/png png;
        }

        add_header Cache-Control "public, max-age=86400";
    }

    # 약관 정적 서빙(#244 §2 약관 URL). 원천은 레포 docs/terms/*.md — scripts/publish_terms.py 로
    #   HTML 생성 후 호스트 /opt/ah0404/media/terms 에 업로드한다(절차: docs/terms/README.md).
    #   URL 은 확장자 없는 versioned 경로(config TERMS_*_URL 과 일치): /terms/service-1.0 → service-1.0.html
    location /terms/ {
        alias /srv/media/terms/;
        try_files $uri $uri.html =404;
        charset utf-8;

        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        return 404;
    }
}
