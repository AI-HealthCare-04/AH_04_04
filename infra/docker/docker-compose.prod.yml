services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Ozcoding1234@}
      MYSQL_DATABASE: ${DB_NAME:-ai_health}
      MYSQL_USER: ${DB_USER:-ozcoding}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Password1234@}
      TZ: "Asia/Seoul"
    ports:
      - "${DB_EXPOSE_PORT:-3306}:${DB_PORT:-3306}"
    networks:
      - app-network
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT:-3306}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    image: ${DOCKER_USER:-ah0404}/${DOCKER_REPOSITORY:-senior-challenge}:app-${APP_VERSION:-v1.0.0}
    env_file: ../../.env
    restart: always
    ports:
      - "${APP_EXPOSE_PORT:-8000}:8000"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      # 운동 영상 정적 서빙(#72/#199): 호스트 미디어 디렉터리를 읽기전용 마운트. 컨테이너 재생성 후에도
      #   호스트 파일은 유지(도커 밖 보관). nginx conf 의 /videos/ alias 대상. 배포 시 이 볼륨이 유지돼야
      #   서버 수동 설정이 덮이지 않는다(템플릿에 반드시 포함).
      - /opt/ah0404/media/videos:/srv/media/videos:ro
    ports:
      - "${NGINX_EXPOSE_PORT:-80}:80"
      - "${NGINX_SSL_EXPOSE_PORT:-443}:443"
    networks:
      - app-network
    depends_on:
      - fastapi

  certbot:
    image: certbot/certbot
    restart: always
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - app-network
    depends_on:
      - nginx

volumes:
  mysql_data:
  certbot-conf:
  certbot-www:

networks:
  app-network:
    driver: bridge
