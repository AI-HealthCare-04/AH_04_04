age_min: 65

training:
  source: KNHANES
  years: [2022, 2023, 2024]
  fit: full_labeled_sample
  weighting: unweighted

validation:
  random_holdout:
    test_size: 0.2
    random_state: 42
  stratified_cv:
    n_splits: 5
    shuffle: true
    random_state: 42

feature_sets:
  default: self_report_plus_waist_days
  fallback: self_report_minimal_days

activity_features:
  walk_days:
    source: BE3_31-compatible day count
    min: 0
    max: 7
  musc_days:
    source: BE5_1-compatible day count
    min: 0
    max: 5
    note: 5 means 5 or more days

target_label: sarcopenia_awgs2025
probability_type: raw
model_version_suffix: awgs2025_days_v3
selected_threshold: 0.20

smote:
  enabled: false
  random_state: 42
