[project]
name = "ah-04-04"
version = "0.1.0"
description = "Senior lifestyle challenge MVP backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 하한을 패치본으로 올린다 — 잠금만 올리면 새로 lock 할 때 취약 버전으로 되돌아갈 수 있다.
    #   GHSA: PKCS#7 Bleichenbacher 오라클(50.0.0), 경로 구축 지수 폭발·와일드카드 DNS(49.0.0).
    "cryptography>=50.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "tomlkit>=0.14.0",
    "tzdata>=2025.2",
]

[dependency-groups]
app = [
    "alembic>=1.17.2",
    # 자정 자동 예측 스케줄러(#422). 앱 프로세스 안에서 도는 인프로세스 타이머라 EC2 1대 구성에
    #   컨테이너를 더 띄우지 않는다. 놓친 실행은 라이브러리가 아니라 '오늘 예측이 있나' 조회로 메운다.
    "apscheduler>=3.11.0,<4",
    "asyncmy>=0.2.11",
    "bcrypt<=4.0.1",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "joblib>=1.3",
    "numpy>=1.24,<2.5",
    "orjson>=3.11.5",
    "pandas>=2.0",
    "passlib[bcrypt]>=1.7.4",
    # PyJWKClient 의 SSRF(스킴 허용목록 부재)·JWKS 무제한 요청 수정본. 우리는 PyJWKClient 를
    #   쓰지 않지만(oauth.py 가 고정 URL 로 직접 조회) 하한을 올려 재발 여지를 없앤다.
    "pyjwt>=2.13.0",
    "scikit-learn>=1.6.1,<1.7",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.40.0",
]
dev = [
    "coverage>=7.13.2",
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "types-passlib>=1.7.7.20250602",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["app/tests"]
norecursedirs = [".git", ".venv", "_local_template_backup_*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
    "B",
    "UP",
    "N",
]
ignore = ["UP046", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/core/db/migrations/*" = ["ALL"]
# 머신러닝 관례상 특징 행렬은 대문자 X(X, Xtr, Xte), 레이블은 소문자 y 로 쓴다.
# 소문자로 바꾸면 관련 문헌·scikit-learn 문서와 대조하기 어려워지므로 이 디렉터리에서만 N806 을 허용한다.
"scripts/ml/*" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
