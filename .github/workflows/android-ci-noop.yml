# Android CI 의 no-op 동반 워크플로.
#
# 왜 필요한가: android/dev 브랜치 보호는 필수 상태 체크 `checks` 를 요구하는데,
# android-ci.yml 은 `paths: android/**` 필터라 docs-only PR(#228, #233 등)에서는
# 트리거 자체가 안 된다 → `checks` 가 영원히 "Expected" 로 남아 승인과 무관하게
# 머지가 잠긴다. 이 워크플로는 android 를 건드리지 않은 PR 에서 같은 이름의
# job(`checks`)으로 즉시 성공을 보고해 그 구멍을 막는다(GitHub 공식 권장 패턴:
# required checks + path filter 조합의 동반 no-op).
#
# paths-ignore 는 android-ci.yml 의 paths 와 정확히 반대 집합이어야 한다:
#  - android 변경 PR → android-ci(실제 검사)만 실행
#  - docs 등 그 외 PR → 이 no-op 만 실행
#  - 혼합 PR → 둘 다 실행(둘 다 초록이어야 머지 — 안전)
name: Android CI (no-op)

on:
  pull_request:
    branches:
      - android/dev
      - main
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op pass
        run: echo "android 변경 없음 — 필수 체크(checks)를 no-op 으로 통과합니다."
