name: Android CI

# PR 트리거에 path 필터를 두지 않는다(리뷰 #245): android/dev 보호 규칙의 필수 체크 `checks` 는
# 이 워크플로가 보고하는데, path 필터로 워크플로 자체가 skip 되면 docs-only PR 에서 체크가
# 영원히 "Expected" 로 남아 승인과 무관하게 머지가 잠긴다(#228·#233 교착). 대신 모든 PR 에서
# job 은 항상 실행하되, 첫 스텝에서 android 변경 여부를 판별해 무관한 PR 은 Gradle 단계를
# 건너뛰고 즉시 성공을 보고한다 — 필수 체크는 언제나 정확히 하나의 `checks` 로 보고된다.
#
# push 는 필수 체크 대상이 아니므로 기존 path 필터를 유지한다(러너 분 절약, 동작 불변).

on:
  pull_request:
    branches:
      - android/dev
      - main
  push:
    branches:
      - android/dev
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PR 에서 android 관련 변경이 있는지 판별한다. push 는 트리거 path 필터가 이미 보장하므로
      # 항상 실행으로 취급한다. (dorny/paths-filter 는 PR 이벤트를 API diff 로 판별 — fetch-depth 무관)
      - name: Detect android changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - "android/**"
              - ".github/workflows/android-ci.yml"

      - name: No-op pass (android 변경 없음)
        if: github.event_name == 'pull_request' && steps.changes.outputs.android != 'true'
        run: echo "android 미변경 PR — Gradle 단계 생략, 필수 체크(checks)를 성공으로 보고합니다."

      - name: Set up JDK 17
        if: github.event_name == 'push' || steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: github.event_name == 'push' || steps.changes.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        if: github.event_name == 'push' || steps.changes.outputs.android == 'true'
        run: chmod +x gradlew

      - name: Compile, test, lint, and assemble
        if: github.event_name == 'push' || steps.changes.outputs.android == 'true'
        run: >-
          ./gradlew
          :app:compileDebugKotlin
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --no-daemon
          --stacktrace

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-failure-reports-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/test-results/

      - name: Upload debug APK
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: android/app/build/outputs/apk/debug/app-debug.apk
